name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"
          enable-cache: true
      - name: Install pinned LilyPond
        run: |
          mkdir -p .tools
          curl --fail --location --silent --show-error \
            https://gitlab.com/lilypond/lilypond/-/releases/v2.26.0/downloads/lilypond-2.26.0-linux-x86_64.tar.gz \
            --output .tools/lilypond.tar.gz
          echo "cd8a097a9f52cb2b9f4e7914774786f203f4fc61fcd299afcbb63c23fa5c6b24  .tools/lilypond.tar.gz" \
            | sha256sum --check --strict
          tar -xzf .tools/lilypond.tar.gz -C .tools
          echo "$GITHUB_WORKSPACE/.tools/lilypond-2.26.0/bin" >> "$GITHUB_PATH"
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest
      - name: CPU neural training smoke
        run: |
          uv run scorerestore generate -c configs/dataset/smoke.yaml --output-root /tmp/scorerestore-data
          uv run scorerestore train -c configs/training/smoke.yaml -o /tmp/scorerestore-training-smoke \
            --set dataset_manifest=/tmp/scorerestore-data/scorerestore-smoke-v1/manifests/samples.jsonl
      - name: Native CLI smoke check
        run: uv run scorerestore --help
      - name: Inspect pinned environment
        run: uv run scorerestore inspect environment
      - name: Validate bundled score provenance
        run: uv run scorerestore inspect provenance

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build CPU image
        run: docker compose build
      - name: Container CLI smoke check
        run: docker compose run --rm scorerestore scorerestore --help
      - name: Container environment check
        run: docker compose run --rm scorerestore scorerestore inspect environment
      - name: Fresh-clone container workflow
        run: |
          docker compose run --rm scorerestore scorerestore inspect provenance
          docker compose run --rm scorerestore scorerestore generate \
            -c configs/dataset/smoke.yaml --output-root /data/ci-fresh
          docker compose run --rm scorerestore scorerestore baseline \
            /data/ci-fresh/scorerestore-smoke-v1/manifests/samples.jsonl \
            -c configs/baseline.yaml -o /runs/ci-fresh-baseline
          docker compose run --rm scorerestore scorerestore train \
            -c configs/training/smoke.yaml -o /runs/ci-fresh-training \
            --set dataset_manifest=/data/ci-fresh/scorerestore-smoke-v1/manifests/samples.jsonl
          docker compose run --rm scorerestore sh -ceu '
            input=$$(find /data/ci-fresh/scorerestore-smoke-v1/inputs -name "*.png" -print -quit)
            scorerestore infer "$$input" -c configs/inference/default.yaml -o /runs/ci-fresh-inference \
              --set checkpoint=/runs/ci-fresh-training/checkpoints/best.pt
          '
