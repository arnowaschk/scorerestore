[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scorerestore"
version = "0.9.0"
description = "Deep-learning restoration and semantic analysis of scanned sheet music"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ScoreRestore contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.13.0.92,<5",
  "Pillow>=11.3,<13",
  "pypdfium2>=4.30,<5",
  "PyYAML>=6.0.2,<7",
  "torch>=2.6,<3",
  "torchvision>=0.24,<1",
  "tqdm>=4.67,<5",
]

[project.scripts]
scorerestore = "scorerestore.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scorerestore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
